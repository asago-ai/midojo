[project]
name = "midojo-sdk"
version = "0.1.0"
description = "Build MiDojo interception layers for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
mcp = [
    "fastmcp",
]

[project.urls]
Homepage = "https://github.com/asago-ai/midojo"
Repository = "https://github.com/asago-ai/midojo"
Issues = "https://github.com/asago-ai/midojo/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo_sdk"]
