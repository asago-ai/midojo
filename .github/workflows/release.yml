name: PyPI Release

on:
  push:
    branches: ["main"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          # midojo and midojo-sdk are released together, at the same version.
          tag = os.environ["RELEASE_TAG"]
          for path in ("pyproject.toml", "interception/python-sdk/pyproject.toml"):
              project = tomllib.loads(Path(path).read_text())["project"]
              expected = f"v{project['version']}"
              if tag != expected:
                  raise SystemExit(f"Release tag {tag!r} must match {project['name']} version: {expected!r}")
          PY

      - name: Build wheels and source distributions
        run: uv build --all-packages

      - name: Check package metadata
        run: uvx --python 3.12 twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/midojo/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
